name: Build

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install xcb libraries for PyInstaller bundling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1 \
            libxcb-xinerama0 libxkbcommon-x11-0 libegl1

      - name: Build executable
        env:
          MPLBACKEND: QtAgg
        run: |
          COMMON_OPTS=(
            --hidden-import matplotlib.backends.backend_qtagg
            --hidden-import matplotlib.backends.backend_qt
            --hidden-import matplotlib.backends.backend_agg
            --hidden-import matplotlib.backends._backend_agg
            --hidden-import matplotlib.widgets
            --hidden-import PySide6.QtGui
            --hidden-import PySide6.QtWidgets
            --hidden-import PySide6.QtCore
            --exclude-module tkinter
            --exclude-module _tkinter
          )
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            pyinstaller --name csv-visualizer --onefile --windowed --icon packaging/icon.ico \
              "${COMMON_OPTS[@]}" main.py
          elif [[ "${{ matrix.os }}" == macos-* ]]; then
            export MACOSX_DEPLOYMENT_TARGET=11.0
            pyinstaller --name csv-visualizer --onefile --windowed --icon packaging/icon.icns \
              "${COMMON_OPTS[@]}" main.py
          else
            pyinstaller --name csv-visualizer --onefile --windowed --icon packaging/icon.png \
              "${COMMON_OPTS[@]}" main.py
          fi
        shell: bash

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: csv-visualizer-${{ matrix.os }}
          path: dist/*

      - name: Install fpm (deb build deps)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential desktop-file-utils
          sudo gem install --no-document fpm

      - name: Build deb (with icon and desktop file)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p pkg/usr/local/bin
          mkdir -p pkg/usr/share/applications
          mkdir -p pkg/usr/share/pixmaps

          cp dist/csv-visualizer pkg/usr/local/bin/csv-visualizer
          cp packaging/csv-visualizer.desktop pkg/usr/share/applications/csv-visualizer.desktop
          cp packaging/icon.png pkg/usr/share/pixmaps/csv-visualizer.png

          cat > after-install.sh << 'SH'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then update-desktop-database || true; fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then gtk-update-icon-cache -f /usr/share/icons/hicolor || true; fi
          exit 0
          SH
          chmod +x after-install.sh

          fpm -s dir -t deb -n csv-visualizer -v 0.1.0 \
            --description "CSV visualizer written in Python/PySide6" \
            --depends 'libxkbcommon-x11-0' \
            --depends 'libxcb1' \
            --depends 'libxcb-xinerama0' \
            --depends 'libxcb-cursor0' \
            --depends 'libxcb-render0' \
            --depends 'libxcb-render-util0' \
            --depends 'libxcb-shape0' \
            --depends 'libxcb-xfixes0' \
            --depends 'libxcb-icccm4' \
            --depends 'libxcb-image0' \
            --depends 'libxcb-keysyms1' \
            --depends 'libxcb-util1' \
            --depends 'libxcb-xkb1' \
            --depends 'libegl1' \
            --after-install after-install.sh \
            -C pkg .

      - name: Upload deb
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: csv-visualizer-deb
          path: ./*.deb

  publish:
    name: Publish release & update README
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -maxdepth 3 -print

      - name: Create release with assets
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          # Delete previous latest release + tag (ignore if absent)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          # Rename files to be unique based on platform
          mv artifacts/csv-visualizer-ubuntu-22.04/csv-visualizer artifacts/csv-visualizer-ubuntu-22.04/csv-visualizer-linux
          mv artifacts/csv-visualizer-windows-latest/csv-visualizer.exe artifacts/csv-visualizer-windows-latest/csv-visualizer-windows.exe
          mv artifacts/csv-visualizer-macos-14/csv-visualizer artifacts/csv-visualizer-macos-14/csv-visualizer-macos-arm64

          # Collect all artifact files
          FILES=$(find artifacts -type f -maxdepth 3 -print)
          echo "Uploading:"
          echo "$FILES"

          # Create release + tag + upload assets atomically
          gh release create latest \
            --title "Latest builds" \
            --notes "Automated latest build artifacts." \
            --prerelease \
            --target "${{ github.sha }}" \
            $FILES

          # Save release URL for README
          RELEASE_URL=$(gh release view latest --json url -q '.url')
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Generate README builds section
        id: gen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_URL: ${{ steps.create_release.outputs.release_url }}
        run: |
          set -e

          # Get asset info as JSON
          ASSETS_JSON=$(gh release view latest --json assets -q '.assets[] | {name: .name, url: .url}')

          # Build markdown using inline python
          python3 - "$RELEASE_URL" "$ASSETS_JSON" << 'PYEOF'
          import sys, json

          release_url = sys.argv[1]
          raw = sys.argv[2]
          assets = [json.loads(line) for line in raw.strip().splitlines()] if raw.strip() else []

          def row(key, label):
              picks = [a for a in assets if key in a["name"].lower()]
              if not picks:
                  return f"- **{label}**: _no build_"
              links = " • ".join(f'[`{a["name"]}`]({a["url"]})' for a in picks)
              return f"- **{label}**: {links}"

          lines = [
              f"**Release:** [latest]({release_url})",
              "",
              row("linux", "Linux (binary)"),
              row("deb", "Linux (.deb package)"),
              row("windows", "Windows"),
              row("macos-intel", "macOS Intel (x86_64)"),
              row("macos-arm64", "macOS Apple Silicon (arm64)"),
          ]

          with open("builds.txt", "w") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: Update README in-place
        run: |
          awk '
            /<!-- BUILDS:START -->/ {
              print
              while ((getline line < "builds.txt") > 0) print line
              close("builds.txt")
              skip=1
              next
            }
            /<!-- BUILDS:END -->/ { print; skip=0; next }
            !skip { print }
          ' README.md > README.tmp
          
          mv README.tmp README.md
          rm -f builds.txt

      - name: Commit README changes
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs: update README latest builds [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master

